name: Build FlashDock Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Package APK and source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FlashDock-debug.apk
          zip -r dist/FlashDock-source.zip . \
            -x './.git/*' './.gradle/*' './app/build/*' './dist/*'

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FlashDock-Android-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK and source ZIP to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FlashDock-debug.apk
            dist/FlashDock-source.zip
          generate_release_notes: true
